apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-invesstor
  namespace: default
  labels:
    app: backend-invesstor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-invesstor
  template:
    metadata:
      labels:
        app: backend-invesstor
    spec:
      containers:
      - name: backend-invesstor
        image: ashermentzer/backend-invesstor:latest
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
