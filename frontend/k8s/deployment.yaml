apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-invesstor
  namespace: default
  labels:
    app: react-invesstor
spec:
  replicas: 3
  selector:
    matchLabels:
      app: react-invesstor
  template:
    metadata:
      labels:
        app: react-invesstor
    spec:
      containers:
      - name: react-invesstor
        image: ashermentzer/react-invesstor:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
