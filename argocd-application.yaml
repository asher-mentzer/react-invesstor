apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: react-invesstor
  namespace: argocd
spec:
  project: default
  
  source:
    repoURL: https://github.com/asher-mentzer/react-invesstor
    targetRevision: main
    path: k8s
  
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
